name: lint

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.15"

      # Config lives in pyproject.toml. Lint only -- never `ruff format`: the
      # notebooks are pushed byte-for-byte to Databricks by scripts/databricks_sync.py.
      - name: ruff check
        run: ruff check --output-format=github .

      # The check the README documents; nothing enforced it before.
      - name: Syntax check
        run: python -m compileall -q scripts notebooks
